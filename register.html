<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>创建账户 · Lingora 会议助手</title>
<meta name="description" content="创建 Lingora 会议助手账户：验证码免密注册，手机号或邮箱均可，支持推荐码。本页为前端演示，验证码不会真实下发。" />
<meta name="theme-color" content="#080D18" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080D18'/%3E%3Cpath d='M6 22.5C6 14 10.5 8.5 16 8.5' stroke='%2312E1B0' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3Cpath d='M26 9.5C26 18 21.5 23.5 16 23.5' stroke='%23FF7A5C' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%2312E1B0'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
<link rel="stylesheet" href="assets/auth.css" />
</head>
<body class="auth-body" data-mode="register">

<a class="skip-link" href="#authCard">跳到注册表单</a>

<!-- ============ 顶栏：只保留品牌与回首页 ============ -->
<header class="nav" id="nav">
  <div class="nav__inner">
    <a class="brand" href="index.html" aria-label="Lingora 首页">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4.5 22.5C4.5 13.5 9.5 7.5 16 7.5" stroke="#12E1B0" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M27.5 9.5C27.5 18.5 22.5 24.5 16 24.5" stroke="#FF7A5C" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="16" cy="16" r="2.6" fill="#12E1B0"/>
      </svg>
      <span class="brand__name">Lingora</span>
    </a>
    <div class="nav__actions">
      <a class="nav__login" href="index.html">返回首页</a>
      <a class="btn btn--mint btn--sm" href="login.html">立即登录</a>
    </div>
  </div>
</header>

<!-- ============ 主体：左侧品牌区 + 右侧注册卡 ============ -->
<div class="auth">
  <div class="auth__glow" aria-hidden="true"></div>

  <div class="container auth__container">
    <div class="auth__grid">

      <!-- ---------- 左侧：延续落地页的深底文案区 ---------- -->
      <aside class="auth__aside">
        <p class="eyebrow" id="asideEyebrow">注册</p>
        <h1 class="auth__title" id="asideTitle"></h1>
        <p class="auth__lead" id="asideLead"></p>

        <ul class="auth__points">
          <li>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8.2" stroke="#12E1B0" stroke-width="1.5"/><path d="M6.2 10.4l2.5 2.5L13.9 7.7" stroke="#12E1B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="asideP1"></span>
          </li>
          <li>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8.2" stroke="#12E1B0" stroke-width="1.5"/><path d="M6.2 10.4l2.5 2.5L13.9 7.7" stroke="#12E1B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="asideP2"></span>
          </li>
          <li>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8.2" stroke="#12E1B0" stroke-width="1.5"/><path d="M6.2 10.4l2.5 2.5L13.9 7.7" stroke="#12E1B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="asideP3"></span>
          </li>
        </ul>

        <p class="auth__note" id="asideNote"></p>

        <p class="demoflag" id="demoFlag">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.3v3.6M8 5.2v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span data-slot></span>
        </p>
      </aside>

      <!-- ---------- 右侧：注册卡（与登录卡共用同一套逻辑） ---------- -->
      <section class="authcard" id="authCard" aria-labelledby="welcome">
        <div class="authcard__head">
          <span class="authcard__region">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="14" height="14"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M1.6 8h12.8M8 1.6c1.9 2 2.8 4.1 2.8 6.4S9.9 12.4 8 14.4C6.1 12.4 5.2 10.3 5.2 8S6.1 3.6 8 1.6z" stroke="currentColor" stroke-width="1.3"/></svg>
            <span id="langLabel"></span>
          </span>
          <button class="authcard__switch" id="regionSwitch" type="button"></button>
        </div>

        <h2 class="authcard__welcome" id="welcome"><span id="welcomeTag"></span></h2>

        <!-- 手机注册 / 邮箱注册（国际区没有手机登录） -->
        <div class="seg" role="tablist" aria-label="注册方式">
          <button type="button" data-tab="phone" role="tab" aria-selected="true"><span data-slot></span></button>
          <button type="button" data-tab="email" role="tab" aria-selected="false"><span data-slot></span></button>
        </div>

        <form class="authform" id="authForm" novalidate>
          <!-- 手机号 -->
          <div class="field" id="phoneField">
            <label class="field__label" id="phoneLabel" for="phoneInput"></label>
            <div class="field__row">
              <button class="field__cc" id="ccButton" type="button" data-code="+86" aria-label="切换国家码">
                <span data-slot>+86</span>
                <svg viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <input class="field__input" id="phoneInput" type="tel" inputmode="numeric" autocomplete="tel" aria-describedby="phoneErr" />
            </div>
            <p class="field__err" id="phoneErr" role="alert"></p>
          </div>

          <!-- 邮箱 -->
          <div class="field" id="emailField" hidden>
            <label class="field__label" id="emailLabel" for="emailInput"></label>
            <input class="field__input" id="emailInput" type="email" autocomplete="email" spellcheck="false" aria-describedby="emailErr" />
            <p class="field__err" id="emailErr" role="alert"></p>
          </div>

          <!-- 图形验证码：服务端生成位图、服务端保存答案、服务端校验 -->
          <div class="field" id="captchaField">
            <label class="field__label" id="captchaLabel" for="captchaInput"></label>
            <div class="field__row field__row--captcha">
              <input class="field__input" id="captchaInput" type="text" inputmode="text" autocomplete="off"
                     autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="4"
                     placeholder="4 位字符" aria-describedby="captchaErr" />
              <div class="captcha" id="captchaBox">
                <button class="captcha__hit" id="captchaImgBtn" type="button" title="点击换一张" aria-label="换一张图形验证码">
                  <img class="captcha__img" id="captchaImg" alt="" width="168" height="56" />
                  <span class="captcha__spin" aria-hidden="true"></span>
                  <span class="captcha__hint" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M12 7a5 5 0 1 1-1.6-3.67" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12 1.7v2.7H9.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </button>
              </div>
            </div>
            <p class="field__err" id="captchaErr" role="alert"></p>
          </div>

          <!-- 验证码 -->
          <div class="field" id="codeField">
            <label class="field__label" id="codeLabel" for="codeInput"></label>
            <div class="field__row field__row--code">
              <input class="field__input" id="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位数字" aria-describedby="codeErr" />
              <button class="codebtn" id="codeBtn" type="button"></button>
            </div>
            <p class="field__err" id="codeErr" role="alert"></p>
          </div>

          <label class="check">
            <input type="checkbox" id="agreeCheck" />
            <span id="agreeText"></span>
          </label>

          <button class="authsubmit" id="authSubmit" type="submit">
            <span class="authsubmit__spin" aria-hidden="true"></span>
            <span id="submitLabel"></span>
          </button>
        </form>

        <div class="divider"><span id="orText"></span></div>

        <div class="oauth">
          <button type="button" id="oauthGoogle" hidden>
            <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
            <span data-slot></span>
          </button>
          <button type="button" id="oauthApple">
            <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="currentColor" d="M12.02 9.55c.02-2.03 1.66-3 1.73-3.05-.94-1.38-2.41-1.57-2.93-1.59-1.25-.13-2.44.73-3.07.63-.63 0-1.61-.71-2.65-.69-1.36.02-2.62.79-3.32 2.01-1.42 2.46-.36 6.1 1.01 8.1.68.98 1.48 2.08 2.53 2.04 1.02-.04 1.4-.65 2.63-.65 1.23 0 1.57.65 2.65.63 1.09-.02 1.78-1 2.45-1.98.77-1.13 1.09-2.23 1.11-2.29-.02-.01-2.13-.82-2.14-3.26zM9.98 3.85c.56-.68.94-1.62.83-2.56-.81.03-1.79.54-2.36 1.21-.51.6-.96 1.56-.84 2.48.9.07 1.82-.46 2.37-1.13z"/></svg>
            <span data-slot></span>
          </button>
        </div>

        <button class="referrallink" id="referralLink" type="button"></button>
        <button class="authswitch" id="switchMode" type="button"></button>
      </section>

    </div>
  </div>
</div>

<!-- ============ 页脚 ============ -->
<footer class="authfoot">
  <div class="container authfoot__inner">
    <p>Lingora · 实时语音转写，打开网页就能用</p>
    <div class="authfoot__links">
      <a href="#terms" id="footTerms"></a>
      <a href="#privacy" id="footPrivacy"></a>
      <a href="index.html" id="footBack"></a>
    </div>
  </div>
</footer>

<!-- ============ 弹窗 1：选择服务器区域（必经步骤） ============ -->
<div class="modal" id="regionModal" hidden role="dialog" aria-modal="true" aria-labelledby="regionTitle">
  <div class="modal__mask"></div>
  <div class="modal__panel">
    <h2 class="modal__title" id="regionTitle"></h2>
    <p class="modal__desc" id="regionDesc"></p>

    <div class="regionlist" role="group" aria-label="服务器区域">
      <button class="regionopt" type="button" data-region="cn" aria-pressed="true">
        <svg class="regionopt__flag" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="10" stroke="#E2DED5" stroke-width="1.2"/><path d="M5 8.2h12M5 11h12M5 13.8h12M11 5v12" stroke="#D2533A" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="regionopt__text">
          <span class="regionopt__name" data-region-name="cn"></span>
          <span class="regionopt__note" data-region-note="cn"></span>
        </span>
      </button>

      <button class="regionopt" type="button" data-region="intl" aria-pressed="false">
        <svg class="regionopt__flag" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="10" stroke="#E2DED5" stroke-width="1.2"/><circle cx="11" cy="11" r="4.6" stroke="#0E9C7A" stroke-width="1.3"/><path d="M1.4 11h19.2M11 1.4c2.6 2.7 3.9 6 3.9 9.6S13.6 17.9 11 20.6C8.4 17.9 7.1 14.6 7.1 11S8.4 4.1 11 1.4z" stroke="#0E9C7A" stroke-width="1.3"/></svg>
        <span class="regionopt__text">
          <span class="regionopt__name" data-region-name="intl"></span>
          <span class="regionopt__note" data-region-note="intl"></span>
        </span>
      </button>
    </div>

    <div class="modal__actions">
      <button class="modal__cancel" id="regionCancel" type="button"></button>
      <button class="modal__confirm" id="regionConfirm" type="button"></button>
    </div>
  </div>
</div>

<!-- ============ 弹窗 2：推荐码 ============ -->
<div class="modal" id="referralModal" hidden role="dialog" aria-modal="true" aria-labelledby="referralTitle">
  <div class="modal__mask"></div>
  <div class="modal__panel">
    <h2 class="modal__title" id="referralTitle"></h2>
    <p class="modal__desc" id="referralDesc"></p>

    <div class="codefield">
      <input id="referralInput" type="text" maxlength="8" autocomplete="off" spellcheck="false" aria-describedby="referralErr" />
      <p class="field__err" id="referralErr" role="alert"></p>
    </div>

    <div class="modal__actions">
      <button class="modal__cancel" id="referralCancel" type="button"></button>
      <button class="modal__confirm" id="referralConfirm" type="button"></button>
    </div>
  </div>
</div>

<!-- 轻提示容器 -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!-- ============ 脚本 ============
     与 login.html 完全一致：auth.js 靠 <body data-mode> 区分登录 / 注册 -->
<script src="assets/vendor/gsap/gsap.min.js" defer></script>
<script src="assets/vendor/gsap/ScrollTrigger.min.js" defer></script>
<script src="assets/vendor/gsap/CustomEase.min.js" defer></script>
<script src="assets/auth.js" defer></script>

</body>
</html>
